<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JISOO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    body { -webkit-tap-highlight-color: transparent; background-color: #f8fafc; font-family: 'Pretendard', sans-serif; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .touch-none { touch-action: none; }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="text-slate-800 selection:bg-purple-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- 기본 유틸리티 ---
    const generateId = () => Math.random().toString(36).substr(2, 9);
    const getTodayStr = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };
    const addDays = (dateStr, days) => {
      const [y, m, d] = dateStr.split('-');
      const date = new Date(y, m - 1, d);
      date.setDate(date.getDate() + days);
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    };

    // --- 아이콘 ---
    const Icons = {
      Home: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>,
      Back: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"/></svg>,
      Plus: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"/></svg>,
      Trash: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>,
      Edit: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>,
      Check: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"/></svg>,
      Rest: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 16h2m-2-4h2m-2-4h2m4 12v-8a4 4 0 00-4-4H9a4 4 0 00-4 4v8"/></svg>,
      Download: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>,
      Upload: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>,
      ChevronDown: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"/></svg>,
      ChevronUp: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 15l7-7 7 7"/></svg>
    };

    const defaultData = {
      manual: { items: [], tags: [] },
      routine: { categories: [], history: {} },
      grape: { challenges: [] },
      genie: { records: {} },
      longie: { records: {} }
    };

    const Accordion = ({ title, children, rightElement }) => {
      const [isOpen, setIsOpen] = useState(true);
      return (
        <div className="bg-white rounded-xl border border-slate-100 shadow-sm overflow-hidden mb-3">
          <div onClick={() => setIsOpen(!isOpen)} className="flex items-center justify-between p-4 bg-slate-50 hover:bg-slate-100 cursor-pointer">
            <div className="font-bold text-slate-800 flex items-center gap-2 flex-1">
              {title}
            </div>
            <div className="flex items-center gap-2 ml-2">
              {rightElement && <div onClick={e => e.stopPropagation()}>{rightElement}</div>}
              {isOpen ? <Icons.ChevronUp /> : <Icons.ChevronDown />}
            </div>
          </div>
          {isOpen && <div className="p-3">{children}</div>}
        </div>
      );
    };

    // 1. 나 사용법 (Manual)
    const ManualApp = ({ data, updateData }) => {
      const [isOpen, setIsOpen] = useState(false);
      const [editId, setEditId] = useState(null);
      const [title, setTitle] = useState('');
      const [content, setContent] = useState('');
      const [tagInput, setTagInput] = useState('');
      const [selectedTags, setSelectedTags] = useState([]);
      const [filterTag, setFilterTag] = useState(null);

      const handleSave = () => {
        if (!title.trim()) return;
        const creationDate = editId ? (data.items.find(i=>i.id===editId)?.date || getTodayStr()) : getTodayStr();
        const newItem = { id: editId || generateId(), title, content, tags: selectedTags, date: creationDate };
        const newItems = editId ? data.items.map(i => i.id === editId ? newItem : i) : [newItem, ...data.items];
        updateData({ ...data, items: newItems });
        setIsOpen(false);
      };

      const openEdit = (item) => { setEditId(item.id); setTitle(item.title); setContent(item.content); setSelectedTags(item.tags || []); setIsOpen(true); };
      const openAdd = () => { setEditId(null); setTitle(''); setContent(''); setSelectedTags([]); setIsOpen(true); };
      
      const allTags = [...new Set(data.items.flatMap(i => i.tags || []))];
      const filteredItems = filterTag ? data.items.filter(i => (i.tags || []).includes(filterTag)) : data.items;
      const availableTags = allTags.filter(t => !selectedTags.includes(t));

      return (
        <div className="fade-in space-y-4 pb-10">
          <div className="flex gap-2 overflow-x-auto hide-scrollbar pb-2">
            <button onClick={() => setFilterTag(null)} className={`px-4 py-1.5 rounded-full whitespace-nowrap text-sm font-bold ${!filterTag ? 'bg-indigo-600 text-white' : 'bg-white text-slate-500 border border-slate-200'}`}>전체</button>
            {allTags.map(tag => (
              <button key={tag} onClick={() => setFilterTag(tag)} className={`px-4 py-1.5 rounded-full whitespace-nowrap text-sm font-bold ${filterTag === tag ? 'bg-indigo-600 text-white' : 'bg-white text-slate-500 border border-slate-200'}`}>#{tag}</button>
            ))}
          </div>

          {filteredItems.map(item => (
            <Accordion key={item.id} title={item.title} rightElement={
              <div className="flex gap-2">
                <button onClick={() => openEdit(item)} className="p-1.5 text-indigo-400 bg-indigo-50 rounded hover:bg-indigo-100 transition-colors"><Icons.Edit/></button>
                <button onClick={() => updateData({...data, items: data.items.filter(i=>i.id!==item.id)})} className="p-1.5 text-red-400 bg-red-50 rounded hover:bg-red-100 transition-colors"><Icons.Trash/></button>
              </div>
            }>
              <div className="text-xs text-slate-400 mb-2 font-medium">작성일: {item.date || '기록 없음'}</div>
              <div className="text-slate-600 whitespace-pre-wrap text-sm mb-3">{item.content || '내용이 없습니다.'}</div>
              <div className="flex gap-1 flex-wrap">
                {(item.tags || []).map(t => <span key={t} className="text-xs bg-indigo-50 text-indigo-600 px-2 py-1 rounded">#{t}</span>)}
              </div>
            </Accordion>
          ))}

          <button onClick={openAdd} className="w-full py-4 bg-indigo-600 text-white rounded-xl font-bold flex items-center justify-center gap-2 shadow-md"><Icons.Plus /> 원칙/교훈 추가하기</button>

          {isOpen && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-5 w-full max-w-sm max-h-[90vh] overflow-y-auto text-slate-800">
                <h3 className="font-bold text-lg mb-4">{editId ? '수정하기' : '새 항목 추가'}</h3>
                <input placeholder="대제목 (예: 돈을 쓸 때 원칙)" value={title} onChange={e=>setTitle(e.target.value)} className="w-full p-3 bg-slate-50 rounded-lg mb-3 border border-slate-200 outline-none"/>
                <textarea placeholder="상세 내용" value={content} onChange={e=>setContent(e.target.value)} className="w-full p-3 bg-slate-50 rounded-lg mb-3 h-32 border border-slate-200 outline-none"></textarea>
                
                <div className="flex gap-2 mb-2 items-center">
                  <input placeholder="새 태그 직접 입력" value={tagInput} onChange={e=>setTagInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter' && tagInput) { setSelectedTags([...new Set([...selectedTags, tagInput])]); setTagInput(''); }}} className="flex-1 p-2.5 bg-slate-50 rounded-lg border border-slate-200 text-sm outline-none"/>
                  <button onClick={()=>{if(tagInput) { setSelectedTags([...new Set([...selectedTags, tagInput])]); setTagInput(''); }}} className="px-3 py-2 bg-slate-200 text-slate-700 rounded-lg text-sm font-bold hover:bg-slate-300">추가</button>
                </div>

                {availableTags.length > 0 && (
                  <div className="mb-4">
                    <span className="text-xs font-bold text-slate-500 block mb-1 text-left">기존 태그 간편 선택</span>
                    <div className="flex flex-wrap gap-1">
                      {availableTags.map(t => (
                        <span key={t} onClick={() => setSelectedTags([...selectedTags, t])} className="bg-slate-100 text-slate-600 px-2 py-1.5 rounded-lg text-xs font-medium cursor-pointer hover:bg-indigo-50 hover:text-indigo-600 transition-colors">
                          + {t}
                        </span>
                      ))}
                    </div>
                  </div>
                )}

                <div className="flex flex-wrap gap-1 mb-4 pt-2 border-t border-slate-100">
                  {selectedTags.length === 0 && <span className="text-xs text-slate-400">선택된 태그가 없습니다.</span>}
                  {selectedTags.map(t => <span key={t} onClick={()=>setSelectedTags(selectedTags.filter(st=>st!==t))} className="bg-indigo-100 text-indigo-700 px-2 py-1 rounded text-sm cursor-pointer hover:bg-indigo-200 font-bold">#{t} &times;</span>)}
                </div>
                <div className="flex gap-2"><button onClick={()=>setIsOpen(false)} className="flex-1 py-3 bg-slate-100 rounded-xl font-bold">취소</button><button onClick={handleSave} className="flex-1 py-3 bg-indigo-600 text-white rounded-xl font-bold">저장</button></div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // 2. 오늘 루틴 (Routine)
    const RoutineApp = ({ data, updateData }) => {
      const [date, setDate] = useState(getTodayStr());
      const [showStats, setShowStats] = useState(false);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editCatId, setEditCatId] = useState(null);
      const [catName, setCatName] = useState('');
      const [catItems, setCatItems] = useState([]);

      const toggleStatus = (itemId, status) => {
        const newHist = { ...data.history };
        if (!newHist[date]) newHist[date] = {};
        if (newHist[date][itemId] === status) delete newHist[date][itemId];
        else newHist[date][itemId] = status;
        updateData({ ...data, history: newHist });
      };

      const restAll = (catId) => {
        const cat = data.categories.find(c => c.id === catId);
        if(!cat) return;
        const newHist = { ...data.history };
        if (!newHist[date]) newHist[date] = {};
        cat.items.forEach(item => newHist[date][item.id] = 'rest');
        updateData({ ...data, history: newHist });
      };

      const openAddCat = () => { setEditCatId(null); setCatName(''); setCatItems([{id: generateId(), name: ''}]); setIsModalOpen(true); };
      const openEditCat = (cat) => { setEditCatId(cat.id); setCatName(cat.name); setCatItems(cat.items.map(i=>({...i}))); setIsModalOpen(true); };
      
      const saveCat = () => {
        if(!catName.trim() || catItems.every(i=>!i.name.trim())) return alert("제목과 내용을 입력해주세요.");
        const validItems = catItems.filter(i => i.name.trim() !== '');
        if (editCatId) updateData({...data, categories: data.categories.map(c => c.id === editCatId ? {...c, name: catName, items: validItems} : c)});
        else updateData({...data, categories: [...data.categories, {id: generateId(), name: catName, items: validItems}]});
        setIsModalOpen(false);
      };

      return (
        <div className="fade-in space-y-4 pb-10">
          <div className="flex justify-between items-center bg-white p-3 rounded-xl shadow-sm border border-slate-100">
            <button onClick={() => setDate(addDays(date, -1))} className="p-2 text-slate-400">&lt;</button>
            <span className="font-bold text-lg text-emerald-600">{date} 오늘 루틴</span>
            <button onClick={() => setDate(addDays(date, 1))} className="p-2 text-slate-400">&gt;</button>
          </div>

          <button onClick={openAddCat} className="w-full py-4 bg-emerald-600 text-white rounded-xl font-bold flex justify-center gap-2 shadow-md"><Icons.Plus/> 새 루틴 추가하기</button>

          {data.categories.map(cat => (
            <Accordion key={cat.id} title={cat.name} rightElement={
              <div className="flex gap-2">
                <button onClick={() => openEditCat(cat)} className="text-xs bg-indigo-50 text-indigo-600 px-2 py-1 rounded shadow-sm font-bold">수정</button>
                <button onClick={() => restAll(cat.id)} className="text-xs bg-orange-100 text-orange-600 px-2 py-1 rounded shadow-sm font-bold">전체 휴식</button>
              </div>
            }>
              {cat.items.map(item => {
                const status = data.history[date]?.[item.id];
                return (
                  <div key={item.id} className="flex justify-between items-center p-3 mb-2 bg-slate-50 rounded-xl border border-slate-100">
                    <span className={`font-medium ${status==='completed'?'text-emerald-600 font-bold':status==='rest'?'line-through text-slate-400':'text-slate-700'}`}>{item.name}</span>
                    <div className="flex gap-1">
                      <button onClick={() => toggleStatus(item.id, 'rest')} className={`p-2 rounded-lg ${status==='rest'?'bg-orange-200 text-orange-700':'bg-white text-slate-400'}`}><Icons.Rest/></button>
                      <button onClick={() => toggleStatus(item.id, 'completed')} className={`p-2 rounded-lg ${status==='completed'?'bg-emerald-200 text-emerald-700':'bg-white text-slate-400'}`}><Icons.Check/></button>
                    </div>
                  </div>
                );
              })}
            </Accordion>
          ))}

          {isModalOpen && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-5 w-full max-w-sm max-h-[90vh] overflow-y-auto text-slate-800">
                <h3 className="font-bold text-lg mb-4">{editCatId ? '수정' : '추가'}</h3>
                <input value={catName} onChange={e=>setCatName(e.target.value)} placeholder="그룹 이름" className="w-full p-3 bg-slate-50 rounded-lg mb-4 border border-slate-200 outline-none"/>
                <div className="space-y-2 mb-4">
                  {catItems.map((item, idx) => (
                    <div key={idx} className="flex gap-2">
                      <input value={item.name} onChange={e=>{const n=[...catItems]; n[idx].name=e.target.value; setCatItems(n);}} placeholder="내용" className="flex-1 p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none"/>
                      <button onClick={()=>setCatItems(catItems.filter((_, i)=>i!==idx))} className="p-2 bg-red-50 text-red-400 rounded-lg"><Icons.Trash/></button>
                    </div>
                  ))}
                  <button onClick={()=>setCatItems([...catItems, {id: generateId(), name: ''}])} className="w-full py-2 bg-slate-100 rounded-lg text-sm font-bold mt-2">항목 추가 +</button>
                </div>
                <div className="flex gap-2">
                  <button onClick={()=>setIsModalOpen(false)} className="flex-1 py-3 bg-slate-100 rounded-xl font-bold">취소</button>
                  <button onClick={saveCat} className="flex-1 py-3 bg-emerald-600 text-white rounded-xl font-bold">저장</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // 3. 100일 포도알 챌린지 (Grape Challenge) - 메모(km) 완벽 복구
    const GrapeApp = ({ data, updateData }) => {
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [editId, setEditId] = useState(null);
      const [title, setTitle] = useState('');
      const [isRecordModalOpen, setIsRecordModalOpen] = useState(false);
      const [selChallenge, setSelChallenge] = useState(null);
      const [selDay, setSelDay] = useState(null);
      const [recDate, setRecDate] = useState(getTodayStr());
      const [recNote, setRecNote] = useState('');

      const saveChallenge = () => {
        if(!title.trim()) return;
        if(editId) updateData({...data, challenges: data.challenges.map(c => c.id === editId ? {...c, title} : c)});
        else updateData({ ...data, challenges: [...data.challenges, { id: generateId(), title, records: {} }] });
        setIsAddModalOpen(false);
      };

      const openRec = (cid, day) => {
        setSelChallenge(cid); setSelDay(day);
        const record = data.challenges.find(x => x.id === cid).records[day];
        setRecNote(record?.note || ''); setRecDate(record?.date || getTodayStr());
        setIsRecordModalOpen(true);
      };

      const saveRec = () => {
        updateData({...data, challenges: data.challenges.map(c => c.id === selChallenge ? {...c, records: {...c.records, [selDay]: {completed: true, note: recNote, date: recDate}}} : c)});
        setIsRecordModalOpen(false);
      };

      return (
        <div className="fade-in space-y-4 pb-10">
          <button onClick={()=>{setEditId(null); setTitle(''); setIsAddModalOpen(true);}} className="w-full py-4 bg-purple-600 text-white rounded-xl font-bold flex justify-center gap-2 shadow-md"><Icons.Plus/> 새 포도알 챌린지</button>
          
          {data.challenges.length === 0 && <p className="text-center text-slate-400 py-10">진행 중인 챌린지가 없습니다.</p>}

          {data.challenges.map(c => (
            <div key={c.id} className="bg-white p-4 rounded-2xl shadow-sm border border-purple-100">
              <div className="flex justify-between items-center mb-4">
                <h3 className="font-bold text-lg">{c.title}</h3>
                <div className="flex gap-2">
                  <button onClick={()=>{setEditId(c.id); setTitle(c.title); setIsAddModalOpen(true);}} className="p-1.5 text-indigo-400 bg-indigo-50 rounded-lg"><Icons.Edit/></button>
                  <button onClick={()=>updateData({...data, challenges: data.challenges.filter(x=>x.id!==c.id)})} className="p-1.5 text-red-400 bg-red-50 rounded-lg"><Icons.Trash/></button>
                </div>
              </div>
              <div className="flex justify-between items-end mb-2">
                <span className="font-bold text-purple-700 bg-purple-100 px-3 py-1 rounded-full text-xs sm:text-sm">
                  완성된 포도: {Math.floor(Object.keys(c.records).length/100)}송이 🍇
                </span>
                <span className="text-purple-500 font-bold text-sm">{Object.keys(c.records).length % 100} / 100</span>
              </div>
              <div className="grid grid-cols-10 gap-1 bg-purple-50 p-2 rounded-xl">
                {Array.from({length:100}).map((_, i) => {
                  const record = c.records[i+1];
                  return (
                    <button key={i+1} onClick={()=>openRec(c.id, i+1)} className={`aspect-square rounded-full flex flex-col items-center justify-center p-0.5 overflow-hidden transition-transform active:scale-95 shadow-sm ${record?'bg-gradient-to-br from-purple-500 to-purple-700 text-white':'bg-white text-slate-300 border border-slate-100'}`}>
                      <span className="font-bold text-[9px] sm:text-[10px] leading-none">{i+1}</span>
                      {/* 메모(km)가 있으면 포도알 안에 표시! */}
                      {record?.note && <span className="text-[7px] sm:text-[8px] font-normal opacity-90 truncate w-full text-center mt-0.5 leading-tight">{record.note}</span>}
                    </button>
                  )
                })}
              </div>
              <p className="text-[10px] text-slate-400 mt-2 text-center">* 동그라미를 클릭하여 날짜와 메모를 기록하세요.</p>
            </div>
          ))}

          {isAddModalOpen && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-5 w-full max-w-sm text-slate-800">
                <h3 className="font-bold text-lg mb-4">챌린지 제목</h3>
                <input value={title} onChange={e=>setTitle(e.target.value)} placeholder="예) 매일 3km 달리기" className="w-full p-3 bg-slate-50 rounded-lg mb-4 border border-slate-200 outline-none"/>
                <div className="flex gap-2"><button onClick={()=>setIsAddModalOpen(false)} className="flex-1 py-3 bg-slate-100 rounded-xl font-bold">취소</button><button onClick={saveChallenge} className="flex-1 py-3 bg-purple-600 text-white rounded-xl font-bold">저장</button></div>
              </div>
            </div>
          )}

          {isRecordModalOpen && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-5 w-full max-w-sm text-slate-800">
                <div className="flex justify-between items-center mb-4 border-b border-slate-100 pb-3">
                  <h3 className="font-bold text-lg text-purple-700">{selDay}일차 기록 🍇</h3>
                  {data.challenges.find(c=>c.id===selChallenge)?.records[selDay] && (
                     <button onClick={()=>{
                       updateData({...data, challenges: data.challenges.map(c => c.id === selChallenge ? {...c, records: (()=>{ const newR={...c.records}; delete newR[selDay]; return newR; })()} : c)});
                       setIsRecordModalOpen(false);
                     }} className="text-xs bg-red-50 text-red-500 px-2 py-1.5 rounded-lg font-bold border border-red-100">포도알 지우기</button>
                  )}
                </div>
                <input type="date" value={recDate} onChange={e=>setRecDate(e.target.value)} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg mb-3 outline-none text-sm"/>
                <textarea value={recNote} onChange={e=>setRecNote(e.target.value)} placeholder="예) 5km 뛰었음!" className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg mb-5 h-20 outline-none text-sm resize-none"></textarea>
                <div className="flex gap-2"><button onClick={()=>setIsRecordModalOpen(false)} className="flex-1 py-3 bg-slate-100 rounded-xl font-bold text-slate-600">닫기</button><button onClick={saveRec} className="flex-1 py-3 bg-purple-600 text-white rounded-xl font-bold">포도알 칠하기</button></div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // 4 & 5. 캘린더 (지니 & 롱이 스케줄)
    const CalendarApp = ({ data, updateData, type }) => {
      const isGenie = type === 'genie';
      const colors = isGenie ? { main: 'bg-teal-600', text: 'text-teal-600', light: 'bg-teal-50', border: 'border-teal-100' } : { main: 'bg-pink-500', text: 'text-pink-500', light: 'bg-pink-50', border: 'border-pink-100' };
      const title = isGenie ? '지니의 스케줄 🧞‍♂️' : '롱이의 스케줄 🐶';
      const [curMonth, setCurMonth] = useState(new Date());
      const [selDate, setSelDate] = useState(null);
      const calendarRef = useRef(null);
      const year = curMonth.getFullYear(); const month = curMonth.getMonth();
      const firstDay = new Date(year, month, 1).getDay(); const daysInMonth = new Date(year, month + 1, 0).getDate();
      const days = []; for(let i=0; i<firstDay; i++) days.push(null); for(let i=1; i<=daysInMonth; i++) days.push(`${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`);

      const save = (d, s, n) => { updateData({...data, records: {...data.records, [d]: {shift:s, note:n}}}); setSelDate(null); };
      const exportImg = () => { html2canvas(calendarRef.current, { scale: 2, backgroundColor: '#f8fafc' }).then(c => { const a = document.createElement('a'); a.download = `Schedule_${year}_${month+1}.png`; a.href = c.toDataURL(); a.click(); }); };

      return (
        <div className="fade-in pb-10">
          <div className="flex justify-end mb-2"><button onClick={exportImg} className="text-xs bg-white border border-slate-200 text-slate-600 px-3 py-2 rounded-xl font-bold shadow-sm">📸 이미지 저장</button></div>
          <div ref={calendarRef} className="bg-slate-50 p-2 rounded-xl">
            <div className="flex justify-between items-center bg-white p-3 rounded-xl shadow-sm border border-slate-100 mb-4">
              <button onClick={() => setCurMonth(new Date(year, month-1, 1))} className="p-2 text-slate-400">&lt;</button>
              <span className={`font-bold text-lg ${colors.text}`}>{year}년 {month+1}월 {title}</span>
              <button onClick={() => setCurMonth(new Date(year, month+1, 1))} className="p-2 text-slate-400">&gt;</button>
            </div>
            <div className="grid grid-cols-7 gap-1 bg-white p-2 rounded-2xl shadow-sm border border-slate-100">
              {['일','월','화','수','목','금','토'].map((d,i)=><div key={i} className={`text-center font-bold text-xs mb-2 ${i===0?'text-red-400':i===6?'text-blue-400':'text-slate-400'}`}>{d}</div>)}
              {days.map((d, i) => {
                if(!d) return <div key={i}></div>;
                const rec = data.records[d];
                return (
                  <div key={d} onClick={()=>setSelDate(d)} className={`min-h-[5rem] p-1 rounded-xl border flex flex-col items-center justify-start cursor-pointer active:scale-95 transition-transform ${rec?.note || rec?.shift ? `${colors.light} ${colors.border}` : 'bg-white border-slate-50'}`}>
                    <span className="text-[11px] font-bold text-slate-700 mb-1">{parseInt(d.split('-')[2])}</span>
                    {isGenie && rec?.shift && <span className={`text-[12px] font-black leading-none mb-1 ${rec.shift==='day'?'text-orange-500':rec.shift==='night'?'text-indigo-600':'text-slate-400'}`}>{rec.shift.toUpperCase()}</span>}
                    {!isGenie && rec?.note && <span className="text-xl">🐶</span>}
                    {rec?.note && <div className="text-[9px] text-slate-600 line-clamp-2 px-0.5">{rec.note}</div>}
                  </div>
                );
              })}
            </div>
          </div>
          {selDate && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-5 w-full max-w-sm text-slate-800">
                <h3 className="font-bold text-lg mb-4">{selDate} 일정</h3>
                {isGenie && <div className="flex gap-2 mb-4">{['DAY','NIGHT','OFF'].map(s=><button key={s} onClick={()=>save(selDate, s.toLowerCase(), data.records[selDate]?.note||'')} className={`flex-1 py-2 rounded-lg font-black border ${data.records[selDate]?.shift===s.toLowerCase()?`${colors.main} text-white`:'bg-white'}`}>{s}</button>)}</div>}
                <textarea defaultValue={data.records[selDate]?.note||''} onBlur={e=>save(selDate, data.records[selDate]?.shift||'', e.target.value)} placeholder="메모" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl mb-4 h-24 outline-none"></textarea>
                <button onClick={()=>setSelDate(null)} className="w-full py-3 bg-slate-100 rounded-xl font-bold">닫기</button>
              </div>
            </div>
          )}
        </div>
      );
    };

    // 6. 합리적 소비 진단 테스트
    const ConsumptionTest = () => {
      const [ans, setAns] = useState(Array(6).fill(null)); const [res, setRes] = useState(false);
      const qs = ["1. 구매 전 24시간 고민했는가?", "2. 현재 목표에 기여하는가?", "3. 비슷한 제품이 있는가?", "4. 단지 '할인' 때문인가?", "5. 꾸준히 쓸 계획인가?", "6. 카드값 후회 안 할 자신 있는가?"];
      const calc = () => { if(ans.includes(null)) return alert("다 답해줘!"); let s=0; [0,1,4,5].forEach(i=>ans[i]==='O'&&(s+=10)); [2,3].forEach(i=>ans[i]==='X'&&(s+=10)); setRes(s); };
      if (res !== false) return <div className="fade-in bg-white p-8 rounded-3xl text-center shadow-sm"> <h2 className="text-2xl font-black mb-2">결과</h2> <div className="text-6xl font-black text-rose-500 mb-6">{res}점</div> <div className={`p-4 rounded-xl font-bold ${res>=50?'bg-emerald-50 text-emerald-700':'bg-rose-50 text-rose-700'}`}>{res>=50?'✨ 사셔도 좋아요!':'🤔 다시 생각해보세요.'}</div> <button onClick={()=>{setAns(Array(6).fill(null)); setRes(false);}} className="mt-8 w-full py-4 bg-slate-800 text-white rounded-xl font-bold">다시하기</button> </div>;
      return <div className="fade-in space-y-4"> {qs.map((q,i)=><div key={i} className="bg-white p-4 rounded-xl border border-slate-100"><p className="font-medium mb-3 text-sm">{q}</p><div className="flex gap-2"><button onClick={()=>{const n=[...ans]; n[i]='O'; setAns(n);}} className={`flex-1 py-2 rounded-lg font-bold border ${ans[i]==='O'?'bg-rose-500 text-white':'bg-slate-50 text-slate-400'}`}>O</button><button onClick={()=>{const n=[...ans]; n[i]='X'; setAns(n);}} className={`flex-1 py-2 rounded-lg font-bold border ${ans[i]==='X'?'bg-slate-500 text-white':'bg-slate-50 text-slate-400'}`}>X</button></div></div>)} <button onClick={calc} className="w-full py-4 bg-rose-500 text-white rounded-xl font-bold shadow-md">결과 확인</button> </div>;
    };

    // 메인 App
    const App = () => {
      const [cur, setCur] = useState('home');
      const [all, setAll] = useState(() => { const s=localStorage.getItem('jisoo_all_data'); return s?JSON.parse(s):defaultData; });
      useEffect(() => localStorage.setItem('jisoo_all_data', JSON.stringify(all)), [all]);
      const upd = (sec, d) => setAll(prev => ({...prev, [sec]: d}));
      const exp = () => { const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(all)],{type:"application/json"})); a.download=`backup_${getTodayStr()}.json`; a.click(); };
      const imp = (e) => { const r=new FileReader(); r.onload=v=>{ try{setAll(JSON.parse(v.target.result)); alert("성공!");}catch{alert("실패!");} }; r.readAsText(e.target.files[0]); };

      const menus = [
        { id: 'manual', title: '나 사용법', icon: '📖', color: 'bg-indigo-100 text-indigo-700' },
        { id: 'routine', title: '오늘 루틴', icon: '✨', color: 'bg-emerald-100 text-emerald-700' },
        { id: 'grape', title: '포도알 챌린지', icon: '🍇', color: 'bg-purple-100 text-purple-700' },
        { id: 'genie', title: '지니의 스케줄', icon: '🧞‍♂️', color: 'bg-teal-100 text-teal-700' },
        { id: 'longie', title: '롱이의 스케줄', icon: '🐶', color: 'bg-pink-100 text-pink-700' },
        { id: 'test', title: '소비 진단 테스트', icon: '🛒', color: 'bg-rose-100 text-rose-700' }
      ];

      const render = () => {
        switch(cur) {
          case 'manual': return <ManualApp data={all.manual} updateData={d=>upd('manual',d)} />;
          case 'routine': return <RoutineApp data={all.routine} updateData={d=>upd('routine',d)} />;
          case 'grape': return <GrapeApp data={all.grape} updateData={d=>upd('grape',d)} />;
          case 'genie': return <CalendarApp data={all.genie} updateData={d=>upd('genie',d)} type="genie" />;
          case 'longie': return <CalendarApp data={all.longie} updateData={d=>upd('longie',d)} type="longie" />;
          case 'test': return <ConsumptionTest />;
          default: return (
            <div className="fade-in pb-10">
              <div className="mb-6 flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <div><h1 className="text-xl font-black">JISOO</h1><p className="text-sm text-slate-500">오늘도 알찬 하루 보내세요!</p></div>
                <div className="flex gap-2">
                  <button onClick={exp} className="p-2 bg-slate-100 rounded-lg"><Icons.Download/></button>
                  <label className="p-2 bg-slate-100 rounded-lg cursor-pointer"><Icons.Upload/><input type="file" onChange={imp} className="hidden"/></label>
                </div>
              </div>
              <div className="grid grid-cols-2 gap-3">
                {menus.map(m=><button key={m.id} onClick={()=>setCur(m.id)} className="p-5 rounded-2xl shadow-sm bg-white flex flex-col items-start gap-3 active:scale-95 transition-transform"><div className={`w-12 h-12 flex items-center justify-center rounded-full text-2xl ${m.color}`}>{m.icon}</div><span className="font-bold">{m.title}</span></button>)}
              </div>
            </div>
          );
        }
      };

      return (
        <div className="min-h-screen max-w-md mx-auto relative bg-slate-50">
          {cur!=='home' && <header className="sticky top-0 bg-white/80 backdrop-blur-md z-40 border-b border-slate-100 p-4 flex items-center justify-between"><button onClick={()=>setCur('home')} className="flex items-center gap-1 text-slate-500 font-bold"><Icons.Back/> 홈</button><span className="font-black text-slate-800">{menus.find(m=>m.id===cur)?.title}</span><div className="w-8"></div></header>}
          <main className="p-4 pt-6">{render()}</main>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
